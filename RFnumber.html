<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:#121417;color:#f1f3f5;display:flex;flex-direction:column;min-height:100vh}
header{padding:12px 16px;background:#1a1d21;border-bottom:1px solid #2c3036;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
.saved-badge{font-size:11px;color:#51cf66;opacity:0;transition:opacity .3s}
.saved-badge.show{opacity:1}
.container{display:flex;flex:1;flex-direction:column}
#viewer{width:100%;height:245px;position:relative;background:#16191d;border-bottom:1px solid #2c3036;flex-shrink:0}
.hint{position:absolute;bottom:8px;right:12px;font-size:11px;color:#868e96;pointer-events:none}
.poly-badge{position:absolute;bottom:8px;left:12px;font-size:11px;color:#69db7c;background:rgba(20,24,28,.75);padding:3px 8px;border-radius:4px;pointer-events:none}
.sidebar{width:100%;padding:16px;background:#1a1d21;display:flex;flex-direction:column;gap:13px;flex:1}
@media(min-width:768px){.container{flex-direction:row}#viewer{height:auto;min-height:calc(100vh - 46px);border-bottom:none;order:2}.sidebar{max-width:390px;border-right:1px solid #2c3036;order:1}}
.plate-input-box{background:#fff;color:#111;border:3px solid #111;border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.plate-dot{width:6px;height:6px;border-radius:50%;background:#222;flex-shrink:0}
.plate-main{display:flex;align-items:baseline;gap:4px;flex:1;justify-content:center}
.plate-reg{border-left:2px solid #111;padding-left:8px;display:flex;flex-direction:column;align-items:center}
input[type=text]{border:1px dashed #bbb;border-radius:4px;text-align:center;font-weight:800;text-transform:uppercase;background:#f8f9fa;color:#111;outline:none;padding:2px 0}
input[type=text]:focus{border-color:#228be6;background:#e7f5ff}
#in-l1{width:36px;font-size:25px}#in-dig{width:76px;font-size:30px}#in-l23{width:62px;font-size:25px}#in-reg{width:60px;font-size:22px}
.rus-label{font-size:10px;font-weight:800;letter-spacing:.5px;margin-top:2px}

.btn-row{display:flex;gap:10px;margin-top:4px}

.btn-3mf{background:#2b8a3e;color:#fff}.btn-3mf:active{background:#237032}
.btn-stl{background:#343a40;color:#dee2e6;flex:.5}.btn-stl:active{background:#495057}

.btn-share:active{background:#343a40;color:#fff}

.history-chip{background:#25282e;border:1px solid #373b42;color:#e9ecef;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}

<body>
<header>
  <h1>🚗 Госномер РФ (3MF для AMS / STL)</h1>
  <span class="saved-badge" id="saved-badge">✓ Сохранено</span>
</header>
<div class="container">
  <div id="viewer">
    <div class="poly-badge" id="poly-badge">Загрузка шрифта...</div>
    <div class="hint">Крути пальцем • Зум двумя</div>
  </div>
  <div class="sidebar">
    <div class="plate-input-box">
      <span class="plate-dot"></span>
      <div class="plate-main">
        <input type="text" id="in-l1" maxlength="1" value="А" />
        <input type="text" id="in-dig" maxlength="3" inputmode="numeric" value="012" />
        <input type="text" id="in-l23" maxlength="2" value="АА" />
      </div>
      <div class="plate-reg">
        <input type="text" id="in-reg" maxlength="3" inputmode="numeric" value="164" />
        <span class="rus-label">RUS 🇷🇺</span>
      </div>
      <span class="plate-dot"></span>
    </div>
    <div class="control-group">
      <label>Крепление под кольцо:</label>
      <select id="sel-lug">
        <option value="external" selected>Выносное ушко слева</option>
        <option value="inside">Отверстие внутри номера (в углу)</option>
        <option value="none">Без отверстия (просто номер)</option>
      </select>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="chk-bolts" checked />Монтажные точки по бокам</label>
    <label class="checkbox-row"><input type="checkbox" id="chk-flag" checked />Флаг РФ (триколор в 3MF)</label>
    <div class="control-group">
      <label>Длина номера: <span id="val-scale">85 мм</span></label>
      <input type="range" id="rng-scale" min="60" max="160" value="85" />
    </div>
    <div class="control-group">
      <label>Толщина основы: <span id="val-base">2.2 мм</span></label>
      <input type="range" id="rng-base" min="1.2" max="4.0" step="0.2" value="2.2" />
    </div>
    <div class="control-group">
      <label>Высота букв и рамки: <span id="val-rel">0.8 мм</span></label>
      <input type="range" id="rng-rel" min="0.4" max="2.0" step="0.2" value="0.8" />
    </div>
    <div class="btn-row">
      <button class="btn-3mf" id="btn-3mf">🎨 Скачать 3MF (AMS)</button>
      <button class="btn-stl" id="btn-stl">STL</button>
    </div>
    <button class="btn-share" id="btn-share">🔗 Скопировать ссылку с настройками</button>
    <div class="history-box" id="history-box">
      <div class="history-header">
        <span>Недавние номера (нажми для загрузки):</span>
        <button class="history-clear" id="btn-clear-history">Очистить</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const STORAGE_KEY = 'rf_plate_3d_settings_v1';
const HISTORY_KEY = 'rf_plate_3d_history_v1';
const $ = id => document.getElementById(id);

const LAT_TO_CYR = {A:'А',B:'В',E:'Е',K:'К',M:'М',H:'Н',O:'О',P:'Р',C:'С',T:'Т',Y:'У',X:'Х'};
const CYR_TO_LAT = {'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','У':'Y','Х':'X'};
const sanitizeGostLetters = s => s.toUpperCase().split('').map(c => LAT_TO_CYR[c] || c).filter(c => 'АВЕКМНОРСТУХ'.includes(c)).join('');
const sanitizeDigits = s => s.replace(/[^0-9]/g, '');
const pushAll = (dst, src) => { for (let i = 0; i < src.length; i++) dst.push(src[i]); };

function getCurrentState() {
  return {
    l1: $('in-l1').value, dig: $('in-dig').value, l23: $('in-l23').value, reg: $('in-reg').value,
    lug: $('sel-lug').value, bolts: $('chk-bolts').checked, flag: $('chk-flag').checked,
    scale: $('rng-scale').value, base: $('rng-base').value, rel: $('rng-rel').value
  };
}

function applyState(d) {
  if (d.l1 !== undefined) $('in-l1').value = sanitizeGostLetters(d.l1);
  if (d.dig !== undefined) $('in-dig').value = sanitizeDigits(d.dig);
  if (d.l23 !== undefined) $('in-l23').value = sanitizeGostLetters(d.l23);
  if (d.reg !== undefined) $('in-reg').value = sanitizeDigits(d.reg);
  if (d.lug !== undefined) $('sel-lug').value = d.lug;
  if (d.bolts !== undefined) $('chk-bolts').checked = (d.bolts === true || d.bolts === '1');
  if (d.flag !== undefined) $('chk-flag').checked = (d.flag === true || d.flag === '1');
  if (d.scale !== undefined) $('rng-scale').value = d.scale;
  if (d.base !== undefined) $('rng-base').value = d.base;
  if (d.rel !== undefined) $('rng-rel').value = d.rel;
}

function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(getCurrentState()));
    const badge = $('saved-badge');
    badge.classList.add('show');
    clearTimeout(window._saveTimer);
    window._saveTimer = setTimeout(() => badge.classList.remove('show'), 1200);
  } catch (e) {}
}

function loadSettings() {
  const p = new URLSearchParams(window.location.search);
  if (p.has('l1') || p.has('dig') || p.has('scale')) {
    const g = k => p.get(k) ?? undefined;
    applyState({ l1: g('l1'), dig: g('dig'), l23: g('l23'), reg: g('reg'), lug: g('lug'),
      bolts: g('bolts'), flag: g('flag'), scale: g('scale'), base: g('base'), rel: g('rel') });
    saveSettings();
    return;
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) applyState(JSON.parse(raw));
  } catch (e) {}
}

$('btn-share').addEventListener('click', async () => {
  const s = getCurrentState();
  const params = new URLSearchParams({ l1: s.l1, dig: s.dig, l23: s.l23, reg: s.reg, lug: s.lug,
    bolts: s.bolts ? '1' : '0', flag: s.flag ? '1' : '0', scale: s.scale, base: s.base, rel: s.rel });
  const shareUrl = `${window.location.origin}${window.location.pathname}?${params}`;
  try {
    await navigator.clipboard.writeText(shareUrl);
    const btn = $('btn-share');
    btn.textContent = '✅ Ссылка скопирована!';
    setTimeout(() => btn.textContent = '🔗 Скопировать ссылку с настройками', 2000);
  } catch (e) {
    prompt('Скопируй ссылку с настройками:', shareUrl);
  }
});

const histLabel = x => `${x.l1}${x.dig}${x.l23} | ${x.reg}`;

function addToHistory() {
  try {
    const item = getCurrentState();
    let list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    list = list.filter(x => histLabel(x) !== histLabel(item));
    list.unshift(item);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 8)));
    renderHistory();
  } catch (e) {}
}

function renderHistory() {
  const box = $('history-box'), container = $('history-list');
  try {
    const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    if (!list.length) { box.style.display = 'none'; return; }
    box.style.display = 'flex';
    container.innerHTML = '';
    list.forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'history-chip';
      chip.innerHTML = `<span>${item.l1}${item.dig}${item.l23} <b>${item.reg}</b></span><span class="sub">${item.scale}мм</span>`;
      chip.addEventListener('click', () => { applyState(item); updateLabels(); saveSettings(); buildPlateMesh(); });
      container.appendChild(chip);
    });
  } catch (e) {}
}

$('btn-clear-history').addEventListener('click', () => { localStorage.removeItem(HISTORY_KEY); renderHistory(); });

// ---------- 3D сцена ----------
const viewer = $('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16191d);
const w0 = viewer.clientWidth || window.innerWidth, h0 = viewer.clientHeight || 245;
const camera = new THREE.PerspectiveCamera(35, w0 / h0, 0.1, 1000);
camera.position.set(0, -18, 92);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(w0, h0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
viewer.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 2.0));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(40, -60, 100);
scene.add(dirLight);

const plateGroup = new THREE.Group();
scene.add(plateGroup);
let colorParts = {};
let loadedFont = null;
let capH1 = 0.73;

const FONT_URLS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/droid/droid_sans_bold.typeface.json'
];

function normalizeGlyph(ch) {
  if (!loadedFont || !loadedFont.data || !loadedFont.data.glyphs) return ch;
  if (loadedFont.data.glyphs[ch]) return ch;
  return CYR_TO_LAT[ch] || ch;
}

function measureCapHeight() {
  const g = new TextGeometry('H', { font: loadedFont, size: 1, height: 0.1, curveSegments: 4 });
  g.computeBoundingBox();
  if (g.boundingBox.max.y > 0.1) capH1 = g.boundingBox.max.y;
  g.dispose();
}

function loadFontWithFallback(idx = 0) {
  if (idx >= FONT_URLS.length) {
    $('poly-badge').textContent = 'Ошибка загрузки шрифта (проверь интернет)';
    return;
  }
  new FontLoader().load(FONT_URLS[idx], font => {
    loadedFont = font;
    measureCapHeight();
    buildPlateMesh();
  }, undefined, () => loadFontWithFallback(idx + 1));
}

function extrudeToPositions(shape, z0, z1, curveSegments = 14) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth: z1 - z0, bevelEnabled: false, curveSegments });
  geo.translate(0, 0, z0);
  const ni = geo.index ? geo.toNonIndexed() : geo;
  const arr = Array.from(ni.attributes.position.array);
  geo.dispose();
  if (ni !== geo) ni.dispose();
  return arr;
}

function createRoundedRect(x, y, w, h, r, isHole = false) {
  const p = isHole ? new THREE.Path() : new THREE.Shape();
  p.moveTo(x + r, y);
  p.lineTo(x + w - r, y);
  p.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  p.lineTo(x + w, y + h - r);
  p.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  p.lineTo(x + r, y + h);
  p.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  p.lineTo(x, y + r);
  p.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return p;
}

function makeText(text, capHeight, scaleX, letterGap, z0, z1, curveSegs = 9, boldness = 0) {
  if (!loadedFont || !text) return { width: 0, place: () => [], dispose() {} };
  const fontSize = capHeight / capH1;
  const items = [];
  for (const ch of Array.from(text).map(normalizeGlyph)) {
    if (ch === ' ') { items.push({ g: null, w: fontSize * 0.35 * scaleX }); continue; }
    const g = new TextGeometry(ch, {
      font: loadedFont, size: fontSize, height: z1 - z0, curveSegments: curveSegs,
      bevelEnabled: boldness > 0, bevelThickness: 0.001, bevelSize: boldness, bevelOffset: 0, bevelSegments: 1
    });
    g.scale(scaleX, 1, 1);
    g.computeBoundingBox();
    const bb = g.boundingBox;
    g.translate(-bb.min.x, 0, z0);
    items.push({ g, w: bb.max.x - bb.min.x });
  }
  const width = items.reduce((a, it) => a + it.w, 0) + Math.max(0, items.length - 1) * letterGap;
  return {
    width,
    place(leftX, baseY, k = 1) {
      const out = [];
      let curX = leftX;
      for (const it of items) {
        if (it.g) {
          const src = it.g.index ? it.g.toNonIndexed() : it.g;
          const a = src.attributes.position.array;
          for (let i = 0; i < a.length; i += 3) out.push(a[i] * k + curX, a[i + 1] + baseY, a[i + 2]);
          if (src !== it.g) src.dispose();
        }
        curX += (it.w + letterGap) * k;
      }
      return out;
    },
    dispose() { items.forEach(it => it.g && it.g.dispose()); }
  };
}

function clearPlateGroup() {
  while (plateGroup.children.length) {
    const c = plateGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    plateGroup.remove(c);
  }
}

function buildPlateMesh() {
  clearPlateGroup();

  const l1 = $('in-l1').value.toUpperCase();
  const dig = $('in-dig').value.toUpperCase();
  const l23 = $('in-l23').value.toUpperCase();
  const reg = $('in-reg').value.toUpperCase();
  const lugMode = $('sel-lug').value;
  const withBolts = $('chk-bolts').checked;
  const withFlag = $('chk-flag').checked;

  const targetW = parseFloat($('rng-scale').value);
  const baseH = parseFloat($('rng-base').value);
  const relH = parseFloat($('rng-rel').value);

  const scale = targetW / 520.0;
  const W = 520 * scale, H = 112 * scale;
  const R_out = 12 * scale, border = 6.0 * scale, R_in = 7.0 * scale;

  const lugD = 11.0, holeD = 4.5;
  const lugOffset = (lugMode === 'external') ? lugD * 0.45 : 0;
  const leftExtra = (lugMode === 'external') ? (lugOffset + lugD / 2) : 0;
  const totalW = W + leftExtra;
  const px0 = -totalW / 2 + leftExtra;
  const py0 = -H / 2;

  const embedZ = Math.min(0.22, baseH * 0.3);
  const relZ0 = +(baseH - embedZ).toFixed(3);
  const relZ1 = +(baseH + relH).toFixed(3);

  // 1. БЕЛАЯ ОСНОВА
  const baseShape = new THREE.Shape();
  baseShape.moveTo(px0 + R_out, py0);
  baseShape.lineTo(px0 + W - R_out, py0);
  baseShape.absarc(px0 + W - R_out, py0 + R_out, R_out, -Math.PI / 2, 0, false);
  baseShape.lineTo(px0 + W, py0 + H - R_out);
  baseShape.absarc(px0 + W - R_out, py0 + H - R_out, R_out, 0, Math.PI / 2, false);
  baseShape.lineTo(px0 + R_out, py0 + H);
  baseShape.absarc(px0 + R_out, py0 + H - R_out, R_out, Math.PI / 2, Math.PI, false);

  if (lugMode === 'external') {
    const cy = py0 + H / 2, lugR = lugD / 2, neckHalf = lugD * 0.42, lugCx = px0 - lugOffset;
    baseShape.lineTo(px0, cy + neckHalf);
    baseShape.lineTo(lugCx, cy + neckHalf);
    baseShape.absarc(lugCx, cy, lugR, Math.PI / 2, Math.PI * 1.5, false);
    baseShape.lineTo(px0, cy - neckHalf);
  }
  baseShape.lineTo(px0, py0 + R_out);
  baseShape.absarc(px0 + R_out, py0 + R_out, R_out, Math.PI, Math.PI * 1.5, false);

  const insideHoleR = 1.65;
  const insideHolePad = insideHoleR + 0.9;
  const insideHoleCx = px0 + border + insideHolePad;
  const insideHoleCy = py0 + H - border - insideHolePad;

  if (lugMode === 'external') {
    const hole = new THREE.Path();
    hole.absarc(px0 - lugOffset, py0 + H / 2, holeD / 2, 0, Math.PI * 2, true);
    baseShape.holes.push(hole);
  } else if (lugMode === 'inside') {
    const hole = new THREE.Path();
    hole.absarc(insideHoleCx, insideHoleCy, insideHoleR, 0, Math.PI * 2, true);
    baseShape.holes.push(hole);
  }

  const whitePositions = extrudeToPositions(baseShape, 0, baseH, 16);
  const blackPositions = [], bluePositions = [], redPositions = [];

  // 2. ЧЁРНАЯ РАМКА С ДВУМЯ ОКНАМИ
  const divStart = 382 * scale;
  const frameOuter = createRoundedRect(px0, py0, W, H, R_out, false);
  const winY = py0 + border, winH = H - border * 2;
  const leftWinR = (lugMode === 'inside') ? Math.min(R_in, 1.2) : R_in;
  frameOuter.holes.push(createRoundedRect(px0 + border, winY, divStart - border, winH, leftWinR, true));
  const rightWinX = px0 + divStart + border;
  const rightWinW = (W - border) - (divStart + border);
  frameOuter.holes.push(createRoundedRect(rightWinX, winY, rightWinW, winH, R_in, true));
  pushAll(blackPositions, extrudeToPositions(frameOuter, relZ0, relZ1, 14));

  // Монтажные точки
  if (withBolts) {
    const dotR = Math.max(0.4, 3.0 * scale);
    if (lugMode !== 'inside') {
      const d = new THREE.Shape();
      d.absarc(px0 + 21 * scale, py0 + 56 * scale, dotR, 0, Math.PI * 2, false);
      pushAll(blackPositions, extrudeToPositions(d, relZ0, relZ1, 12));
    }
    const d2 = new THREE.Shape();
    d2.absarc(px0 + 499 * scale, py0 + 56 * scale, dotR, 0, Math.PI * 2, false);
    pushAll(blackPositions, extrudeToPositions(d2, relZ0, relZ1, 12));
  }

  // 3. СИМВОЛЫ — АВТОРАССТАНОВКА
  {
    const winMidY = py0 + H / 2;
    const digCap = 66 * scale;
    const letCap = digCap * 0.82;
    const baseY = winMidY - digCap / 2;

    let contentL = px0 + border + ((withBolts && lugMode !== 'inside') ? 28 : 12) * scale;
    if (lugMode === 'inside') contentL = Math.max(contentL, insideHoleCx + insideHoleR + 1.2);
    const contentR = px0 + divStart - 12 * scale;
    const avail = contentR - contentL;

    const parts = [
      makeText(l1, letCap, 0.88, 6 * scale, relZ0, relZ1, 9),
      makeText(dig, digCap, 0.88, 10 * scale, relZ0, relZ1, 10),
      makeText(l23, letCap, 0.88, 6 * scale, relZ0, relZ1, 9)
    ].filter(t => t.width > 0);

    const n = parts.length;
    if (n) {
      const sum = parts.reduce((a, t) => a + t.width, 0);
      const gaps = n - 1;
      const minGap = 12 * scale, maxGap = 24 * scale;
      let k = 1, gap = 0;
      if (gaps > 0) {
        if (sum + gaps * minGap > avail) { k = Math.max(0.5, (avail - gaps * minGap) / sum); gap = minGap; }
        else gap = Math.min(maxGap, (avail - sum) / gaps);
      } else if (sum > avail) k = avail / sum;
      let cx = contentL + (avail - (sum * k + gaps * gap)) / 2;
      for (const t of parts) {
        pushAll(blackPositions, t.place(cx, baseY, k));
        cx += t.width * k + gap;
      }
    }
    parts.forEach(t => t.dispose());
  }

  // 3б. Правое окно: крупный регион сверху, исходные «RUS» + флаг снизу
  {
    const rContentL = rightWinX + 6 * scale;
    const rContentR = rightWinX + rightWinW - (withBolts ? 20 : 6) * scale;
    const availR = rContentR - rContentL;

    const is3 = reg.trim().length >= 3;
    const regCap = (is3 ? 50 : 54) * scale;
    const regGap = (is3 ? 2.5 : 4.5) * scale;
    const regT = makeText(reg, regCap, 0.90, regGap, relZ0, relZ1, 9);
    if (regT.width > 0) {
      const kr = Math.min(1, availR / regT.width);
      pushAll(blackPositions, regT.place(rContentL + (availR - regT.width * kr) / 2, py0 + 45 * scale, kr));
    }
    regT.dispose();

    const rusCap = 17 * scale;
    const rusT = makeText('RUS', rusCap, 0.96, 3 * scale, relZ0, relZ1, 6, 0.55 * scale);
    const fw = 36 * scale, fh = 18 * scale, flagGap = 6 * scale;
    const flagPart = withFlag ? flagGap + fw : 0;
    const kRus = Math.min(1, (availR - flagPart) / rusT.width);
    const rowW = rusT.width * kRus + flagPart;
    const rowL = rContentL + (availR - rowW) / 2;
    const rusBase = py0 + 15 * scale;
    pushAll(blackPositions, rusT.place(rowL, rusBase, kRus));
    rusT.dispose();

    // 4. ФЛАГ РФ
    if (withFlag) {
      const fx = rowL + rusT.width * kRus + flagGap;
      const fy = rusBase + (rusCap - fh) / 2;
      const bw = Math.max(0.25, 1.3 * scale);

      const rect = (rx, ry, rw, rh) => {
        const s = new THREE.Shape();
        s.moveTo(rx, ry); s.lineTo(rx + rw, ry); s.lineTo(rx + rw, ry + rh); s.lineTo(rx, ry + rh); s.closePath();
        return s;
      };
      const flagBorder = rect(fx, fy, fw, fh);
      const flagHole = new THREE.Path();
      flagHole.moveTo(fx + bw, fy + bw);
      flagHole.lineTo(fx + bw, fy + fh - bw);
      flagHole.lineTo(fx + fw - bw, fy + fh - bw);
      flagHole.lineTo(fx + fw - bw, fy + bw);
      flagHole.closePath();
      flagBorder.holes.push(flagHole);
      pushAll(blackPositions, extrudeToPositions(flagBorder, relZ0, relZ1, 1));

      const inW = fw - 2 * bw, sh = (fh - 2 * bw) / 3;
      pushAll(redPositions, extrudeToPositions(rect(fx + bw, fy + bw, inW, sh), relZ0, relZ1, 1));
      pushAll(bluePositions, extrudeToPositions(rect(fx + bw, fy + bw + sh, inW, sh), relZ0, relZ1, 1));
      pushAll(whitePositions, extrudeToPositions(rect(fx + bw, fy + bw + sh * 2, inW, sh), relZ0, relZ1, 1));
    }
  }

  colorParts = {
    white: { color: '#FFFFFF', hex: 0xffffff, pos: whitePositions },
    black: { color: '#18181B', hex: 0x18181b, pos: blackPositions },
    blue:  { color: '#0055FF', hex: 0x0055ff, pos: bluePositions },
    red:   { color: '#E61919', hex: 0xe61919, pos: redPositions }
  };

  let totalTris = 0;
  for (const data of Object.values(colorParts)) {
    if (!data.pos.length) continue;
    totalTris += data.pos.length / 9;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(data.pos, 3));
    geo.computeVertexNormals();
    plateGroup.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: data.hex, roughness: 0.4 })));
  }

  $('poly-badge').textContent = loadedFont ? `${totalTris.toLocaleString('ru-RU')} треуг.` : 'Загрузка векторного шрифта...';

  const dist = Math.max(78, totalW * 0.92);
  camera.position.set(0, -dist * 0.22, dist);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ---------- Экспорт ----------
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
}

function buildIndexedMeshXml(pos, pid, pindex) {
  const vertMap = new Map(), vertices = [], triangles = [];
  const getIdx = (x, y, z) => {
    const kx = Math.round(x * 1000), ky = Math.round(y * 1000), kz = Math.round(z * 1000);
    const key = `${kx}_${ky}_${kz}`;
    let idx = vertMap.get(key);
    if (idx === undefined) {
      idx = vertices.length;
      vertMap.set(key, idx);
      vertices.push(`          <vertex x="${(kx / 1000).toFixed(3)}" y="${(ky / 1000).toFixed(3)}" z="${(kz / 1000).toFixed(3)}" />`);
    }
    return idx;
  };
  const numTris = pos.length / 9;
  for (let i = 0; i < numTris; i++) {
    const b = i * 9;
    const v1 = getIdx(pos[b], pos[b + 1], pos[b + 2]);
    const v2 = getIdx(pos[b + 3], pos[b + 4], pos[b + 5]);
    const v3 = getIdx(pos[b + 6], pos[b + 7], pos[b + 8]);
    if (v1 !== v2 && v2 !== v3 && v1 !== v3) {
      triangles.push(`          <triangle v1="${v1}" v2="${v2}" v3="${v3}" pid="${pid}" p1="${pindex}" />`);
    }
  }
  return `        <vertices>\n${vertices.join('\n')}\n        </vertices>\n        <triangles>\n${triangles.join('\n')}\n        </triangles>`;
}

async function export3MF(filename) {
  if (typeof JSZip === 'undefined') {
    alert('Библиотека JSZip ещё загружается, проверь интернет и нажми ещё раз.');
    return;
  }
  const zip = new JSZip();
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>
</Types>`);
  zip.folder('_rels').file('.rels', `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/>
</Relationships>`);

  const entries = Object.entries(colorParts).filter(([_, d]) => d.pos.length > 0);
  let objectsXml = '', buildItemsXml = '', matXml = '';
  entries.forEach(([name, data], idx) => {
    const objId = idx + 1;
    matXml += `      <base name="${name}" displaycolor="${data.color}" />\n`;
    objectsXml += `    <object id="${objId}" name="plate_${name}" type="model" pid="10" pindex="${idx}">
      <mesh>
${buildIndexedMeshXml(data.pos, 10, idx)}
      </mesh>
    </object>\n`;
    buildItemsXml += `    <item objectid="${objId}" />\n`;
  });

  zip.folder('3D').file('3dmodel.model', `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">
  <resources>
    <basematerials id="10">
${matXml}    </basematerials>
${objectsXml}  </resources>
  <build>
${buildItemsXml}  </build>
</model>`);

  triggerDownload(await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }), filename);
}

const updateLabels = () => {
  $('val-scale').textContent = $('rng-scale').value + ' мм';
  $('val-base').textContent = $('rng-base').value + ' мм';
  $('val-rel').textContent = $('rng-rel').value + ' мм';
};

['in-l1', 'in-dig', 'in-l23', 'in-reg', 'sel-lug', 'chk-bolts', 'chk-flag', 'rng-scale', 'rng-base', 'rng-rel'].forEach(id => {
  const el = $(id);
  const handler = () => {
    if (id === 'in-l1' || id === 'in-l23') {
      const c = sanitizeGostLetters(el.value);
      if (el.value !== c) el.value = c;
    } else if (id === 'in-dig' || id === 'in-reg') {
      const c = sanitizeDigits(el.value);
      if (el.value !== c) el.value = c;
    }
    updateLabels();
    saveSettings();
    buildPlateMesh();
  };
  el.addEventListener('input', handler);
  el.addEventListener('change', handler);
});

const getPlateName = () => (`${$('in-l1').value}${$('in-dig').value}${$('in-l23').value}_${$('in-reg').value}`.toUpperCase().trim() || 'RF');

$('btn-3mf').addEventListener('click', () => { addToHistory(); export3MF(`nomer_${getPlateName()}.3mf`); });

$('btn-stl').addEventListener('click', () => {
  addToHistory();
  const result = new STLExporter().parse(plateGroup, { binary: true });
  triggerDownload(new Blob([result], { type: 'application/octet-stream' }), `nomer_${getPlateName()}.stl`);
});

function resizeViewer() {
  const nw = viewer.clientWidth || window.innerWidth, nh = viewer.clientHeight || 245;
  camera.aspect = nw / nh;
  camera.updateProjectionMatrix();
  renderer.setSize(nw, nh);
}
window.addEventListener('resize', resizeViewer);

loadSettings();
updateLabels();
renderHistory();
buildPlateMesh();
resizeViewer();
loadFontWithFallback(0);

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
